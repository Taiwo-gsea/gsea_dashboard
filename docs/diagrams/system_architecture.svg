<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>GSEA Dashboard — System Architecture Diagram</title>
<desc>Three-tier architecture: User layer (browser), Frontend layer (Streamlit), Backend layer (FastAPI, SQLite, NLP pipeline), with external data sources (GMT, CodeCarbon, Electricity Maps API)</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ── Layer labels (left margin) ── -->
<text x="12" y="105" font-family="sans-serif" font-size="11" fill="#888" transform="rotate(-90,12,105)" text-anchor="middle">User</text>
<text x="12" y="260" font-family="sans-serif" font-size="11" fill="#888" transform="rotate(-90,12,260)" text-anchor="middle">Frontend</text>
<text x="12" y="430" font-family="sans-serif" font-size="11" fill="#888" transform="rotate(-90,12,430)" text-anchor="middle">Backend</text>
<text x="12" y="560" font-family="sans-serif" font-size="11" fill="#888" transform="rotate(-90,12,560)" text-anchor="middle">External</text>

<!-- ── Tier dividers ── -->
<line x1="32" y1="155" x2="648" y2="155" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="32" y1="325" x2="648" y2="325" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="32" y1="495" x2="648" y2="495" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4 4"/>

