[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (requires FastAPI test client)
    slow: Tests that take >5 seconds
